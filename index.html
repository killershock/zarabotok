<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#16a34a">
<meta name="description" content="Учёт оказанных услуг и заработка: день, неделя, месяц, год. Сотрудники и их суммы.">
<title>Заработок — учёт услуг</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Заработок">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="phone">
  <main id="main">
    <section class="view" id="view-home" data-view="home"></section>
    <section class="view" id="view-records" data-view="records" hidden></section>
    <section class="view" id="view-staff" data-view="staff" hidden></section>
    <section class="view" id="view-more" data-view="more" hidden></section>
  </main>

  <nav class="tabbar" aria-label="Навигация">
    <button class="tab" data-nav="home" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.6 12 3l9 7.6V21a1 1 0 0 1-1 1h-5.5v-6.2h-5V22H4a1 1 0 0 1-1-1z"/></svg>
      <span>Главная</span>
    </button>
    <button class="tab" data-nav="records" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3h11A2.5 2.5 0 0 1 20 5.5v13A2.5 2.5 0 0 1 17.5 21h-11A2.5 2.5 0 0 1 4 18.5zM8 8h8M8 12h8M8 16h5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <span>Записи</span>
    </button>
    <button class="fab" data-action="add-entry" type="button" aria-label="Добавить запись">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
    </button>
    <button class="tab" data-nav="staff" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8ZM17 11a3 3 0 1 0 0-6M2 20c0-3.3 3.1-6 7-6s7 2.7 7 6M17 14c2.8.4 5 2.9 5 5.6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <span>Сотрудники</span>
    </button>
    <button class="tab" data-nav="more" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <span>Ещё</span>
    </button>
  </nav>
</div>

<div id="sheet-root" aria-live="polite"></div>
<div id="toast" class="toast" role="status"></div>

<script src="app.js"></script>
</body>
</html>
